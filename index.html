  --mint: #2dd4a8;
  --mint-soft: rgba(45,212,168,0.14);
  --text-light: #eaeaf0;
  --text-dim: #7a7a8a;
  --text-dark: #2a2a30;
  --text-dark-muted: #8a857c;

  --pl-bg: rgba(100,60,200,0.14);

  --sans: 'DM Sans', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; }

body {
  background: var(--cream);
  color: var(--text-dark);

  padding-block: 0;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.header {

  align-items: baseline;
  justify-content: space-between;
  padding: 24px 0 20px;
  position: sticky;

  z-index: 20;
  flex-wrap: wrap;
  gap: 12px;
}
.brand {
  font-family: var(--serif);
  font-size: 2rem;
  color: var(--ink);
  letter-spacing: -0.02em;
  line-height: 1;
  cursor: pointer;
}
.brand em { font-style: italic; color: var(--mint); }

.header-right { display: flex; align-items: center; gap: 10px; }

.search-wrap { position: relative; }
.search-wrap svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);

}
.search-input {
  font-family: var(--sans); font-size: 0.82rem;
  background: var(--cream-deep); border: 1px solid rgba(0,0,0,0.06);

}
.search-input:focus { border-color: var(--mint); }
.search-input::placeholder { color: var(--text-dark-muted); }

.tabs {
  display: flex; gap: 2px; background: var(--cream-deep);
  border-radius: 24px; padding: 3px;
}
.tab {
  font-family: var(--sans); font-size: 0.78rem; font-weight: 500;
  padding: 7px 16px; border-radius: 20px; border: none;
  background: transparent; color: var(--text-dark-muted);
  cursor: pointer; transition: all 0.15s;
}
.tab:hover { color: var(--text-dark); }
.tab.on { background: var(--ink); color: var(--mint); }

.dcard {
  background: var(--card); border-radius: 18px;
  padding: 22px; color: var(--text-light);
}
.dtitle {
  font-family: var(--serif); font-size: 1.15rem;
  color: var(--text-light); margin-bottom: 14px;
}

.bento {
  display: grid; grid-template-columns: repeat(12, 1fr);
  gap: 10px; margin-top: 16px;
}
.scorers { grid-column: span 7; min-height: 0; }
.results { grid-column: span 5; min-height: 0; }

.prow {
  display: grid; grid-template-columns: 24px 1fr auto auto auto auto;
  align-items: center; gap: 6px; padding: 9px 6px;
  border-radius: 8px; cursor: pointer; transition: background 0.1s;
}
.prow:hover { background: var(--card-up); }
.prow + .prow { border-top: 1px solid rgba(255,255,255,0.04); }
.prank { font-size: 0.7rem; color: var(--text-dim); text-align: center; font-variant-numeric: tabular-nums; }
.pname { font-size: 0.84rem; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pteam { font-size: 0.7rem; color: var(--text-dim); }
.lbadge { font-size: 0.55rem; font-weight: 600; padding: 2px 5px; border-radius: 4px; }
.lbadge.pl { background: var(--pl-bg); color: var(--pl); }
.lbadge.ll { background: var(--liga-bg); color: var(--liga); }
.pval { font-size: 0.82rem; text-align: right; min-width: 28px; font-variant-numeric: tabular-nums; }
.pval.g { color: var(--mint); font-weight: 600; }
.pval.a { color: var(--text-light); }
.pval.x { color: var(--text-dim); }
.pheader {
  display: grid; grid-template-columns: 24px 1fr auto auto auto auto;
  gap: 6px; padding: 0 6px 6px;
  border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 2px;
}
.pheader span { font-size: 0.6rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
.pheader span:nth-child(n+4) { text-align: right; }

.mcard { background: var(--card-up); border-radius: 12px; padding: 12px 14px; }
.mcard + .mcard { margin-top: 6px; }
.mcard-meta {
  font-size: 0.56rem; color: var(--text-dim); text-transform: uppercase;
  letter-spacing: 0.08em; font-weight: 600; margin-bottom: 5px;

}
.mcard-meta .dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
.mcard-meta .dot.pl-dot { background: var(--pl); }
.mcard-meta .dot.ll-dot { background: var(--liga); }
.mline { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.mteam { font-size: 0.8rem; font-weight: 500; color: var(--text-light); line-height: 1.2; }
.mteam.aw { text-align: right; }
.mscore {
  font-family: var(--serif); font-size: 1.2rem; color: #fff;
  text-align: center; font-variant-numeric: tabular-nums;
}

.view { display: none; }
.view.active { display: block; }

.detail-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; }
.detail-name { font-family: var(--serif); font-size: 1.8rem; color: #fff; line-height: 1.1; }
.detail-sub { font-size: 0.82rem; color: var(--text-dim); margin-top: 4px; }
.back-btn {
  background: var(--card-up); border: 1px solid var(--card-border);
  color: var(--text-light); font-family: var(--sans); font-size: 0.78rem;
  padding: 7px 16px; border-radius: 20px; cursor: pointer;
}
.back-btn:hover { background: var(--card-border); }

.mini-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px; }
.mini { background: var(--card-up); border-radius: 12px; padding: 14px; text-align: center; }

.radar-box { display: flex; justify-content: center; padding: 8px 0; }

.p90t { width: 100%; border-collapse: collapse; margin-top: 14px; }

.slots { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.slot {

}
.slot:hover { border-color: var(--mint); }
.slot-label { font-size: 0.58rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
.slot-name { font-size: 0.85rem; color: var(--text-dim); margin-top: 2px; }

.vs-text { font-family: var(--serif); font-size: 1rem; color: var(--text-dim); }

.legend-bar { display: flex; justify-content: center; gap: 20px; margin-bottom: 8px; }
.leg { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--text-light); }
.ldot { width: 8px; height: 8px; border-radius: 50%; }

.picker-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px;
}
.picker-bg[hidden] { display: none !important; }
.picker-box {
  background: var(--card); border-radius: 18px; width: 100%; max-width: 400px;
  max-height: 65vh; display: flex; flex-direction: column; overflow: hidden;

.picker-top { padding: 16px; border-bottom: 1px solid var(--card-border); }
.picker-top input {

.picker-top input:focus { border-color: var(--mint); }

.picker-items { overflow-y: auto; padding: 8px; flex: 1; }

.pki:hover { background: var(--card-up); }
.pki-name { font-size: 0.85rem; color: #fff; font-weight: 500; }
.pki-team { font-size: 0.7rem; color: var(--text-dim); }

.footer {

  font-style: italic; font-family: var(--serif);

  .search-input { width: 160px; }
  .brand { font-size: 1.6rem; }
}
@media (max-width: 480px) {

  .search-input { width: 100%; }
}

const P=D.p, M=D.m;
let filt="all", pChart=null, cChart=null, pkSlot=null;
const cSlots={a:null,b:null};
const RL=["Goals","Assists","Shots","Key Passes","Dribbles","Recoveries"];
const RK=["gp","ap9","shp","kpp","drp","rcp"];
const RM=[2.0,0.8,6.0,5.0,5.0,4.0];
const norm=p=>RK.map((k,i)=>Math.min((p[k]||0)/RM[i]*100,100));
const copts=ds=>({type:"radar",data:{labels:RL,datasets:ds},options:{
  responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false}},
  scales:{r:{beginAtZero:true,max:100,ticks:{display:false,stepSize:25},
    grid:{color:"rgba(255,255,255,0.06)"},angleLines:{color:"rgba(255,255,255,0.06)"},
    pointLabels:{color:"#7a7a8a",font:{family:"'DM Sans'",size:11,weight:"500"}}}}}});

function fp(){
  let pl=P;
  if(filt!=="all"&&filt!=="compare") pl=pl.filter(p=>p.l===filt);
  const q=document.getElementById("search").value.toLowerCase();
  if(q) pl=pl.filter(p=>p.n.toLowerCase().includes(q)||p.t.toLowerCase().includes(q));
  return pl;
}
function renderHome(){
  const pl=fp();
  const ml=filt==="all"||filt==="compare"?M:M.filter(m=>m.l===(filt==="Premier League"?"Premier League":"La Liga"));
  const el=document.getElementById("plist");
  el.innerHTML="";
  pl.slice(0,25).forEach((p,i)=>{
    const c=p.l==="Premier League"?"pl":"ll",lb=c==="pl"?"PL":"LL";
    const r=document.createElement("div");r.className="prow";
    r.innerHTML=`<span class="prank">${i+1}</span><div><div class="pname">${p.n}</div><div class="pteam">${p.t}</div></div><span class="lbadge ${c}">${lb}</span><span class="pval g">${p.g}</span><span class="pval a">${p.a}</span><span class="pval x">${p.xg.toFixed(1)}</span>`;
    r.addEventListener("click",()=>showPlayer(p));el.appendChild(r);
  });
  const mel=document.getElementById("mlist");mel.innerHTML="";
  ml.slice(0,8).forEach(m=>{
    const isPL=m.l==="Premier League";
    mel.innerHTML+=`<div class="mcard"><div class="mcard-meta"><span class="dot ${isPL?'pl-dot':'ll-dot'}"></span>${isPL?'Premier League':'La Liga'} · ${m.d}</div><div class="mline"><div class="mteam">${m.h}</div><div class="mscore">${m.hg} – ${m.ag}</div><div class="mteam aw">${m.aw}</div></div></div>`;
  });
}
function showView(id){document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));document.getElementById(id).classList.add("active");}
function showPlayer(p){
  showView("v-player");
  const c=p.l==="Premier League"?"pl":"ll",lb=c==="pl"?"PL":"LL";
  document.getElementById("det-left").innerHTML=`<div class="detail-top"><div><div class="detail-name">${p.n}</div><div class="detail-sub">${p.t} · <span class="lbadge ${c}">${lb}</span> · ${p.pos}</div></div><button class="back-btn" onclick="showView('v-home')">Back</button></div><div class="mini-grid"><div class="mini"><div class="mini-v" style="color:var(--mint)">${p.g}</div><div class="mini-l">Goals</div></div><div class="mini"><div class="mini-v">${p.a}</div><div class="mini-l">Assists</div></div><div class="mini"><div class="mini-v">${p.xg}</div><div class="mini-l">xG</div></div><div class="mini"><div class="mini-v">${p.ap}</div><div class="mini-l">Apps</div></div></div><div class="mini-grid"><div class="mini"><div class="mini-v">${p.mn}</div><div class="mini-l">Minutes</div></div><div class="mini"><div class="mini-v">${p.sh}</div><div class="mini-l">Shots</div></div><div class="mini"><div class="mini-v">${p.kp}</div><div class="mini-l">Key Passes</div></div><div class="mini"><div class="mini-v">${p.dr}</div><div class="mini-l">Dribbles</div></div></div>`;
  if(pChart)pChart.destroy();
  pChart=new Chart(document.getElementById("pRadar"),copts([{data:norm(p),borderColor:"#2dd4a8",backgroundColor:"rgba(45,212,168,0.12)",borderWidth:2,pointRadius:3,pointBackgroundColor:"#2dd4a8"}]));
  document.getElementById("p90t").innerHTML=[["Goals",p.gp],["Assists",p.ap9],["xG",p.xgp],["Shots",p.shp],["Key Passes",p.kpp],["Dribbles",p.drp],["Tackles",p.tkp],["Interceptions",p.icp],["Recoveries",p.rcp]].map(([l,v])=>`<tr><td>${l}/90</td><td>${(v||0).toFixed(2)}</td></tr>`).join("");
}
function openPicker(s){pkSlot=s;document.getElementById("picker").hidden=false;const i=document.getElementById("pkinput");i.value="";i.focus();renderPicker("");}
function renderPicker(q){
  let pl=P;if(q)pl=pl.filter(p=>p.n.toLowerCase().includes(q));
  const el=document.getElementById("pkitems");el.innerHTML="";
  pl.slice(0,30).forEach(p=>{const d=document.createElement("div");d.className="pki";d.innerHTML=`<div><div class="pki-name">${p.n}</div><div class="pki-team">${p.t}</div></div><span class="pval g">${p.g}G</span>`;d.addEventListener("click",()=>{cSlots[pkSlot]=p;document.getElementById("picker").hidden=true;updateCompare();});el.appendChild(d);});
}
function updateCompare(){
  const a=cSlots.a,b=cSlots.b;
  if(a){document.getElementById("sA").classList.add("filled");document.querySelector("#sA .slot-name").textContent=a.n;}
  if(b){document.getElementById("sB").classList.add("filled");document.querySelector("#sB .slot-name").textContent=b.n;}
  if(!a||!b)return;
  document.getElementById("cleg").hidden=false;
  document.getElementById("cleg").innerHTML=`<div class="leg"><div class="ldot" style="background:#2dd4a8"></div>${a.n}</div><div class="leg"><div class="ldot" style="background:#a78bfa"></div>${b.n}</div>`;
  if(cChart)cChart.destroy();
  cChart=new Chart(document.getElementById("cRadar"),copts([
    {data:norm(a),borderColor:"#2dd4a8",backgroundColor:"rgba(45,212,168,0.12)",borderWidth:2,pointRadius:3,pointBackgroundColor:"#2dd4a8"},
    {data:norm(b),borderColor:"#a78bfa",backgroundColor:"rgba(167,139,250,0.10)",borderWidth:2,pointRadius:3,pointBackgroundColor:"#a78bfa"}]));
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("on"));b.classList.add("on");
  filt=b.dataset.f;if(filt==="compare")showView("v-compare");else{showView("v-home");renderHome();}
}));
document.getElementById("search").addEventListener("input",renderHome);
document.getElementById("logo").addEventListener("click",()=>{filt="all";document.querySelectorAll(".tab").forEach(t=>t.classList.remove("on"));document.querySelector('[data-f="all"]').classList.add("on");showView("v-home");renderHome();});
document.getElementById("sA").addEventListener("click",()=>openPicker("a"));
document.getElementById("sB").addEventListener("click",()=>openPicker("b"));
document.getElementById("pkinput").addEventListener("input",e=>renderPicker(e.target.value.toLowerCase()));
document.getElementById("picker").addEventListener("click",e=>{if(e.target.id==="picker")e.target.hidden=true;});
renderHome();
</script>
